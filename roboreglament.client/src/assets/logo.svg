<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">RoboРегламент — иконка портала</title>
  <desc id="desc">Робот на фоне шестерни, с чек-листом, кубком и турнирной схемой. Прозрачный фон.</desc>
  <defs>
    <linearGradient id="gear" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox"><stop stop-color="#27D9F5"/><stop offset=".48" stop-color="#087DDF"/><stop offset="1" stop-color="#174AC5"/></linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset=".62" stop-color="#E9F5FF"/><stop offset="1" stop-color="#9ECDF8"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5CFFFA"/><stop offset="1" stop-color="#00BDE8"/></linearGradient>
    <linearGradient id="blueCard" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#188FDE"/><stop offset="1" stop-color="#07529B"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF285"/><stop offset=".45" stop-color="#FFC629"/><stop offset="1" stop-color="#F18A07"/></linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071D40"/><stop offset="1" stop-color="#123C77"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="13" stdDeviation="17" flood-color="#073875" flood-opacity=".22"/></filter>
  </defs>
  <!-- Decorative gear, fully transparent outside the illustration -->
  <g id="gear" filter="url(#shadow)">
    <path d="M466 130h92l19 63q36 8 65 24l57-35 67 67-33 58q18 31 25 64l65 18v96l-65 18q-7 35-25 66l33 57-67 68-58-34q-29 16-64 24l-19 64h-92l-20-64q-35-8-64-24l-58 34-67-68 34-57q-18-31-25-66l-65-18v-96l65-18q7-33 25-64l-34-58 67-67 58 35q29-16 64-24z" fill="url(#gear)" stroke="#096AC0" stroke-width="10" stroke-linejoin="round"/>
    <circle cx="512" cy="436" r="238" fill="#06346D" opacity=".70"/>
  </g>
  <g id="orbit" fill="none" stroke="url(#teal)" stroke-width="31" stroke-linecap="round">
    <path d="M197 584C55 598 61 752 240 773"/>
    <path d="M818 563c148 44 172 168 47 201"/>
  </g>
  <!-- Antenna -->
  <g id="antenna">
    <path d="M494 236l7-71h23l7 71" fill="url(#white)" stroke="#B7DDF9" stroke-width="4"/>
    <circle cx="512" cy="151" r="37" fill="url(#teal)" stroke="#0DA6DC" stroke-width="5"/>
  </g>
  <!-- Robot head -->
  <g id="robot" filter="url(#shadow)">
    <rect x="242" y="369" width="90" height="121" rx="43" fill="url(#teal)" stroke="#0D76BB" stroke-width="7"/>
    <rect x="692" y="369" width="90" height="121" rx="43" fill="url(#teal)" stroke="#0D76BB" stroke-width="7"/>
    <rect x="291" y="240" width="442" height="316" rx="149" fill="url(#white)" stroke="#B6DDFC" stroke-width="7"/>
    <rect x="337" y="315" width="350" height="181" rx="91" fill="url(#navy)"/>
    <path d="M405 423q17-34 39 0M574 423q17-34 39 0" fill="none" stroke="#36F6FA" stroke-width="21" stroke-linecap="round"/>
    <path d="M439 561q73 30 146 0l37 73H402z" fill="url(#white)" stroke="#A1C9ED" stroke-width="6"/>
  </g>
  <!-- Left checklist -->
  <g id="checklist" transform="rotate(-8 293 722)" filter="url(#shadow)">
    <rect x="117" y="602" width="346" height="314" rx="39" fill="url(#blueCard)" stroke="#0D5799" stroke-width="7"/>
    <rect x="147" y="629" width="286" height="257" rx="25" fill="url(#white)"/>
    <rect x="218" y="587" width="143" height="65" rx="18" fill="url(#teal)" stroke="#109DC9" stroke-width="5"/>
    <circle cx="289" cy="603" r="10" fill="#075C92"/>
    <g fill="none" stroke="#04B894" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"><path d="M188 700l23 23 39-47"/><path d="M188 772l23 23 39-47"/><path d="M188 843l23 23 39-47"/></g>
    <g stroke="#589BCB" stroke-width="16" stroke-linecap="round"><path d="M284 706h108"/><path d="M284 778h108"/><path d="M284 849h108"/></g>
  </g>
  <!-- Right tournament bracket -->
  <g id="tournament-bracket" transform="rotate(7 732 744)" filter="url(#shadow)">
    <rect x="607" y="615" width="292" height="300" rx="38" fill="url(#blueCard)" stroke="#0B67B0" stroke-width="7"/>
    <path d="M657 758h49m-49 0v92h49m0-92h33m-33 92h33m0-46h40" fill="none" stroke="#DDF5FF" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="743" y="676" width="104" height="66" rx="17" fill="url(#white)"/>
    <rect x="743" y="778" width="104" height="66" rx="17" fill="url(#white)"/>
    <rect x="777" y="862" width="87" height="39" rx="13" fill="url(#white)"/>
  </g>
  <!-- Center trophy -->
  <g id="trophy" filter="url(#shadow)">
    <path d="M394 690h-67v35q0 78 92 78M630 690h67v35q0 78-92 78" fill="none" stroke="#F7A711" stroke-width="24" stroke-linejoin="round"/>
    <path d="M412 658h200v91q0 107-100 130-100-23-100-130z" fill="url(#gold)" stroke="#F2A20A" stroke-width="7"/>
    <path d="M512 707l19 38 42 6-31 29 7 42-37-20-37 20 7-42-31-29 42-6z" fill="#FFFFFF"/>
    <path d="M482 863h60v34h-60z" fill="url(#gold)"/>
    <rect x="445" y="893" width="134" height="37" rx="14" fill="url(#blueCard)"/>
  </g>
</svg>
